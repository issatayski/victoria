<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Victoria CRM — демо системы для реабилитационного центра</title>
<meta name="description" content="Демо CRM для реабилитационного центра Victoria (Шымкент): пациенты, коечный фонд, запись, заявки, касса, склад, аналитика. Рабочие места для главврача, врача, регистратуры, бухгалтерии, завсклада и пациента.">
<meta name="theme-color" content="#0B6FB8">
<link rel="canonical" href="https://issatayski.github.io/victoria/">

<meta property="og:site_name" content="Victoria CRM">

<meta property="og:url" content="https://issatayski.github.io/victoria/">
<meta property="og:title" content="Victoria CRM — демо для реабилитационного центра">
<meta property="og:description" content="120 коек, запись, заявки из WhatsApp и Instagram, касса, склад и аналитика. Шесть рабочих мест в одной системе.">
<meta property="og:image" content="https://issatayski.github.io/victoria/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:title" content="Victoria CRM — демо для реабилитационного центра">
<meta name="twitter:description" content="Шесть рабочих мест: главврач, врач, регистратура, бухгалтерия, склад, пациент.">
<meta name="twitter:image" content="https://issatayski.github.io/victoria/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B6FB8'/%3E%3Cpath d='M9 9l7 14 7-14' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0B6FB8;--brand-d:#08568F;--brand-50:#E7F1FA;--brand-100:#CFE3F4;
  --teal:#13A08F;--teal-50:#E3F5F2;--navy:#10294B;--navy-2:#16365F;
  --bg:#EEF2F7;--card:#FFFFFF;--line:#DCE3EB;--line-2:#EDF1F5;
  --text:#18283A;--muted:#667789;--ok:#1C9A66;--ok-50:#E3F4EC;--warn:#D98A0B;--warn-50:#FCF1DC;
  --bad:#D2433F;--bad-50:#FBE7E6;--violet:#6A5BD6;--violet-50:#EEEBFB;
  --r:10px;--side:252px;--side-c:74px;
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 16px;background:linear-gradient(160deg,#E7F1FA 0%,#EEF2F7 45%,#E3F5F2 100%)}
.lbox{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(16,41,75,.08)}
.lbox .lh{padding:26px 28px 6px;text-align:center}
.lbox .lh .mk{width:52px;height:52px;border-radius:14px;background:var(--brand);display:grid;place-items:center;margin:0 auto 12px}
.lbox .lh b{font-size:20px;display:block}
.lbox .lh small{color:var(--muted)}
.lform{padding:18px 28px 22px}
.lform .fld input{height:44px;padding:0 12px 0 40px}
.lform .inp{position:relative}
.lform .inp svg.i{position:absolute;left:12px;top:12px;width:19px;height:19px;color:var(--muted)}
.lform .row2{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:-4px 0 16px}
.lform .row2 label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.lform .go{width:100%;height:46px;justify-content:center;font-size:15px}
.lerr{color:var(--bad);font-size:13px;margin:-6px 0 12px;display:none}
.lerr.on{display:block}
.ldemo{border-top:1px solid var(--line-2);padding:16px 28px 24px}
.ldemo .t{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:12px}
.rbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rbtn{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;text-align:center;transition:border-color .15s,background .15s}
.rbtn:hover{border-color:var(--brand);background:var(--brand-50)}
.rbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.rbtn .ri{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.rbtn .ri svg.i{width:19px;height:19px}
.lfoot{margin-top:18px;text-align:center;color:var(--muted);font-size:12px;max-width:460px}
@media (max-width:420px){.rbtns{grid-template-columns:repeat(2,1fr)}.lform,.ldemo{padding-left:20px;padding-right:20px}}

/* ---------- SHELL ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;height:100%}
.app.col{grid-template-columns:var(--side-c) 1fr}
.side{background:var(--navy);color:#C9D6E6;display:flex;flex-direction:column;min-height:0;position:sticky;top:0;height:100vh;height:100dvh}
.side .logo{padding:18px 18px 14px;color:#fff}
.side .logo .txt{white-space:nowrap;overflow:hidden}
.rolepill{margin:0 14px 10px;background:var(--navy-2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.rolepill .av{width:34px;height:34px}
.rolepill b{color:#fff;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rolepill small{font-size:11.5px;opacity:.8;white-space:nowrap}
.rolepill .t{min-width:0}
.nav{flex:1;overflow:auto;padding:6px 10px}
.nav a span{overflow:hidden;text-overflow:ellipsis}.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#C9D6E6;text-decoration:none;margin-bottom:2px;white-space:nowrap;position:relative}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--brand);color:#fff}
.nav a .bd{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:20px;padding:1px 7px;font-weight:600}
.side-foot{padding:10px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px}
.side-foot button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;white-space:nowrap;color:#C9D6E6}
.side-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.app.col .side .txt,.app.col .nav a span,.app.col .nav a .bd,.app.col .side-foot span,.app.col .rolepill .t{display:none}
.app.col .rolepill{justify-content:center;padding:8px;margin:0 10px 10px}
.app.col .nav a,.app.col .side-foot button{justify-content:center}
.app.col .side .logo{justify-content:center;padding-left:0;padding-right:0}
.app.col .colbtn svg{transform:rotate(180deg)}
.main{min-width:0;display:flex;flex-direction:column;min-height:0;height:100vh;height:100dvh;overflow:auto}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:14px;padding:0 24px;flex:none}
.top h1{font-size:18px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.srch{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:9px;padding:7px 12px;color:var(--muted);width:260px}
.srch input{border:0;background:none;outline:0;width:100%}
.today{color:var(--muted);font-size:13px;white-space:nowrap}
.ibtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--muted);position:relative}
.ibtn:hover{background:var(--bg);color:var(--text)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.top .mlogo{display:none}
.content{padding:22px 24px 40px;max-width:1440px;width:100%}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-100);color:var(--brand-d);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:56px;height:56px;font-size:18px}

/* bottom nav */
.bnav{display:none}

/* ---------- COMPONENTS ---------- */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card>.hd h3{margin:0;font-size:15px;font-weight:600}
.card>.hd .sp{flex:1}
.card>.bd{padding:16px}
.card>.bd.p0{padding:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.kpi{padding:16px}
.kpi .l{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.kpi .v{font-size:26px;font-weight:700;margin:6px 0 4px;letter-spacing:-.3px}
.kpi .d{font-size:12.5px}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand)}
.kpi .ic svg.i{width:17px;height:17px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#b9c6d4}
.btn.pr{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pr:hover{background:var(--brand-d)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.gh{border-color:transparent;background:transparent;color:var(--brand)}
.btn svg.i{width:17px;height:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--bg);color:#3d4f63}
.bdg.ok{background:var(--ok-50);color:var(--ok)}
.bdg.warn{background:var(--warn-50);color:#9a6206}
.bdg.bad{background:var(--bad-50);color:var(--bad)}
.bdg.info{background:var(--brand-50);color:var(--brand-d)}
.bdg.teal{background:var(--teal-50);color:#0b7a6c}
.bdg.vio{background:var(--violet-50);color:var(--violet)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);background:#F8FAFC;white-space:nowrap}
table.t td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.cl{cursor:pointer}
table.t tr.cl:hover td{background:#F7FAFD}
table.t .r{text-align:right}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:500;display:block;white-space:nowrap}
.who small{color:var(--muted);font-size:12px;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bar.teal i{background:var(--teal)}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.sec-h .sp{flex:1}
.sec-h p{margin:0;color:var(--muted)}
.mb{margin-bottom:16px}
.list-i{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.list-i:last-child{border-bottom:0}
.list-i .gr{flex:1;min-width:0}
.list-i .gr b{font-weight:500;display:block}
.src{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;font-size:11px;font-weight:700}
.src svg.i{width:15px;height:15px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:var(--font);fill:var(--muted);font-size:11px}

/* beds */
.floors{display:grid;gap:18px}
.floor h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.rooms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}@media(max-width:1100px){.rooms{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}}
.room{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}
.room .rn{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.room .rn b{color:var(--text)}
.beds{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bed{all:unset;cursor:pointer;height:34px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:600}
.bed.occ{background:var(--brand);color:#fff}
.bed.occ.f{background:#8C5BC9}
.bed.free{background:var(--ok-50);color:var(--ok);border:1px dashed #86cbac}
.bed.bron{background:var(--warn-50);color:#9a6206}
.bed.clean{background:#E9EDF2;color:#7a8898}
.bed.out{background:var(--bad-50);color:var(--bad)}

/* heatmap */
.hm{display:grid;gap:4px;font-size:12px}
.hm .c{height:34px;border-radius:5px;display:grid;place-items:center;font-weight:600;font-size:11.5px}
.hm .lb{display:flex;align-items:center;color:var(--text);font-size:13px;white-space:nowrap;padding-right:8px}
.hm .th{color:var(--muted);text-align:center}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kc{background:#E6ECF3;border-radius:10px;padding:10px;min-width:230px}
.kc>.kh{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-weight:600;font-size:13.5px}
.kc>.kh .n{margin-left:auto;background:#fff;border-radius:12px;padding:0 8px;font-size:12px;color:var(--muted)}
.kc>.kh i{width:8px;height:8px;border-radius:50%}
.lc{background:#fff;border-radius:9px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.lc .tp{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lc b{font-weight:500}
.lc .ds{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.lc .ft{display:flex;align-items:center;gap:6px;justify-content:space-between}

/* schedule */
.sch{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
.sch .h{position:sticky;top:0;background:#F8FAFC;border-bottom:1px solid var(--line);padding:8px 10px;font-size:12.5px;z-index:1}
.sch .h b{display:block;font-weight:600;font-size:13px;white-space:nowrap}
.sch .tm{font-size:12px;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line-2);background:#FBFCFD;position:sticky;left:0}
.sch .sl{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:3px;min-height:46px}
.ap{border-radius:6px;padding:5px 7px;font-size:12px;line-height:1.3;height:100%;border-left:3px solid var(--brand);background:var(--brand-50);cursor:pointer}
.ap b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap span{color:#4a5b6e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ap.done{background:#EEF2F5;border-color:#9aa9b9;opacity:.8}
.ap.now{background:var(--teal-50);border-color:var(--teal)}
.ap.noshow{background:var(--bad-50);border-color:var(--bad)}
.ap.lunch{background:repeating-linear-gradient(45deg,#f3f5f8,#f3f5f8 6px,#eceff3 6px,#eceff3 12px);border:0;color:var(--muted);display:grid;place-items:center;cursor:default}

/* patient card drawer & modal */
.ov{position:fixed;inset:0;background:rgba(16,41,75,.45);z-index:40;display:flex;justify-content:flex-end}
.ov.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(560px,100%);background:#fff;height:100%;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px);animation:sl .2s ease}
@keyframes sl{from{transform:translateX(30px);opacity:.4}}
.modal{width:min(480px,100%);background:#fff;border-radius:14px;max-height:90vh;overflow:auto;animation:pp .16s ease}
@keyframes pp{from{transform:scale(.97);opacity:.5}}
.mh{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fff;z-index:1}
.mh h3{margin:0;font-size:16px;flex:1}
.mb2{padding:18px}
.mf{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.dl{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.scale{display:flex;align-items:center;gap:10px;margin:8px 0}
.scale .bar{flex:1;height:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:11px 16px;z-index:60;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(16,41,75,.25);animation:pp .2s}
.toast svg.i{color:#5fe0c5}
.wa{background:#E7DED4;border-radius:10px;padding:14px;background-image:radial-gradient(#d9cfc3 1px,transparent 1px);background-size:14px 14px}
.bub{background:#fff;border-radius:10px 10px 10px 2px;padding:9px 11px;max-width:320px;font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.08);margin-bottom:8px}
.bub.me{background:#D9FDD3;border-radius:10px 10px 2px 10px;margin-left:auto}
.bub .tm{display:block;text-align:right;font-size:10.5px;color:#7b8a7d;margin-top:3px}
.stars{display:flex;gap:4px}
.stars button{all:unset;cursor:pointer;color:#cfd6de}
.stars button.on{color:#F2B01E}
.stars svg.i{width:26px;height:26px;fill:currentColor;stroke:none}
.pc-hero{background:linear-gradient(135deg,var(--brand),#0E8BA8);color:#fff;border-radius:14px;padding:18px}
.pc-hero .bar{background:rgba(255,255,255,.25)}
.pc-hero .bar i{background:#fff}
.ring{position:relative;width:120px;height:120px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 14px}

function barChart(vals,labels,o={}){
  const W=640,H=o.h||220,pl=44,pb=26,pt=12,max=(o.max||Math.max(...vals))*1.1,n=vals.length,bw=(W-pl-10)/n;
  let g='';for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*k/4;const v=max*(1-k/4);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#E6EBF1"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${o.fmt?o.fmt(v):nf(v)}</text>`}
  vals.forEach((v,i)=>{const h=(H-pt-pb)*v/max,x=pl+i*bw+bw*.18,y=H-pb-h;g+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${h}" rx="4" fill="${i===n-1?(o.hl||'#0B6FB8'):(o.c||'#9CC5E8')}"/><text x="${x+bw*.32}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function lineChart(series,labels,o={}){
  const W=640,H=o.h||200,pl=40,pb=26,pt=14;const all=series.flatMap(s=>s.v);const max=o.max||Math.max(...all)*1.1,min=o.min??0;const n=labels.length;const X=i=>pl+(W-pl-14)*i/(n-1),Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  let g='';for(let k=0;k<=4;k++){const v=min+(max-min)*k/4,y=Y(v);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#E6EBF1"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${Math.round(v)}${o.u||''}</text>`}
  labels.forEach((l,i)=>{if(n<=12||i%2===0)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  series.forEach(s=>{const pts=s.v.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');if(s.fill)g+=`<polygon points="${X(0)},${Y(min)} ${pts} ${X(n-1)},${Y(min)}" fill="${s.c}" opacity=".1"/>`;g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round"/>`;s.v.forEach((v,i)=>{if(i===n-1)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="#fff" stroke="${s.c}" stroke-width="2.5"/>`})});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function donut(parts,o={}){
  const tot=parts.reduce((a,p)=>a+p.v,0);let a=-Math.PI/2,g='';const r=54,cx=70,cy=70;
  parts.forEach(p=>{const da=p.v/tot*Math.PI*2;const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a);a+=da;const x2=cx+r*Math.cos(a),y2=cy+r*Math.sin(a);g+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${da>Math.PI?1:0} 1 ${x2} ${y2}" fill="none" stroke="${p.c}" stroke-width="22"/>`});
  return `<div class="row" style="gap:18px;flex-wrap:nowrap"><svg viewBox="0 0 140 140" width="140" height="140" style="flex:none">${g}<text x="70" y="66" text-anchor="middle" font-size="12" fill="#667789" font-family="Golos Text">${o.t||''}</text><text x="70" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#18283A" font-family="Golos Text">${o.v||''}</text></svg><div style="display:grid;gap:8px;font-size:13px;min-width:0">${parts.map(p=>`<div class="row" style="gap:8px;flex-wrap:nowrap"><i style="width:10px;height:10px;border-radius:3px;background:${p.c};flex:none"></i><span style="flex:1">${p.l}</span><b class="num">${o.f?o.f(p.v):pct(p.v,tot)+'%'}</b></div>`).join('')}</div></div>`;
}
const ring=(v,c='#0B6FB8',label='')=>{const r=48,C=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 120 120" width="120" height="120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 60 60)"/></svg><b>${label}</b></div>`};

/* ================= PAGES ================= */
const kpi=(l,v,d,i,cls='up')=>`<div class="card kpi"><div class="l"><span class="ic">${ic(i)}</span>${l}</div><div class="v num">${v}</div><div class="d ${cls}">${d}</div></div>`;
const bedStats=()=>{const c={occ:0,free:0,bron:0,clean:0};BEDS.forEach(b=>c[b.s]++);return c};
const hallLoad=()=>{const hours=[9,10,11,12,14,15,16];return HALLS.map(h=>({h,v:hours.map((hr,i)=>{let base={mech:78,physio:84,lfk1:72,lfk2:80,mass:92,pool:66,ergo:70}[h.id];if(hr===12||hr===16)base-=18;if(hr===10||hr===11)base+=10;return Math.max(20,Math.min(100,base+ri(-8,8)))})}))};
const HL=hallLoad();
const hmColor=v=>v>=90?['#0B6FB8','#fff']:v>=75?['#5A9FD6','#fff']:v>=55?['#B7D6EF','#0c3d66']:['#E7F1FA','#5a7690'];
